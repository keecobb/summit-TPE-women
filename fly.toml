# Fly.io app config -- alternative to render.yaml, same Dockerfile.
# Generated by hand to match this project rather than `fly launch`;
# replace `app` with a globally-unique name before first deploy
# (`flyctl apps create <name>` or just edit this and `flyctl deploy`).
#
# min_machines_running = 1 keeps one instance always warm (no cold
# starts) -- at ~$2.43-7/mo depending on the size picked below, per
# Fly's pay-as-you-go pricing at time of writing. Set it to 0 instead if
# occasional cold starts are fine and you'd rather pay closer to $0
# during quiet periods.

app = "summit-tpe-api"          # <-- change this, must be globally unique on Fly
primary_region = "sjc"          # pick whatever's closest to your users

[build]

[env]
  SUMMIT_TPE_ALLOWED_ORIGINS = "*"   # replace with your real site domain(s) before going public

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Set the real API key as a secret (never commit it -- that's why it's
# not in [env] above):
#   flyctl secrets set SUMMIT_TPE_API_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
